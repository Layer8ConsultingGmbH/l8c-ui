name: CI - Run Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test l8c-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-components

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared-components/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Run unit tests
        run: npm test -- --coverage --coverage-reporters=json-summary

      - name: Write coverage summary
        if: always()
        run: |
          SUMMARY_JSON=$(find coverage -name coverage-summary.json | head -n 1)
          if [ -n "$SUMMARY_JSON" ]; then
            echo "## Coverage l8c-ui" >> $GITHUB_STEP_SUMMARY
            node -e '
              const total = require(process.argv[1]).total;
              const rows = ["statements", "branches", "functions", "lines"].map(
                m => `| ${m} | ${total[m].covered}/${total[m].total} | ${total[m].pct}% |`
              );
              console.log(["| Metric | Covered | Percent |", "| --- | --- | --- |", ...rows].join("\n"));
            ' "./$SUMMARY_JSON" >> $GITHUB_STEP_SUMMARY
          fi
