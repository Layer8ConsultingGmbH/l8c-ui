name: CI - Dependency Scan

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, Monday 06:00 UTC: catch advisories published between PRs
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit-l8c-ui:
    name: Audit l8c-ui (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"

      - name: Audit npm dependencies
        working-directory: shared-components
        run: |
          set -o pipefail
          npm audit --audit-level=high | tee audit.txt

      - name: Write audit summary
        if: always()
        working-directory: shared-components
        run: |
          if [ -f audit.txt ]; then
            {
              echo "## Audit l8c-ui (npm audit)"
              echo '```'
              cat audit.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi
