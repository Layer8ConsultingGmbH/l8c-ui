name: CD - Publish to npm

# Stages @l8c/ui on npm when the library version in
# shared-components/projects/l8c-ui/package.json is not yet published.
# Runs on every push to main; pushes that keep the version unchanged end after
# the cheap comparison job.
#
# Staged publishing: the package is uploaded to npm's staging queue, not to
# the live registry. A maintainer reviews it and approves with 2FA on
# npmjs.com or via `npm stage approve <stage-id>`. Only then does the version
# become installable.


on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  check-version:
    name: Compare version with npm
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.compare.outputs.should-publish }}
      version: ${{ steps.compare.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"

      - name: Compare local and published version
        id: compare
        run: |
          LOCAL=$(node -p "require('./shared-components/projects/l8c-ui/package.json').version")
          PUBLISHED=$(npm view @l8c/ui version 2>/dev/null || echo "none")
          echo "local=$LOCAL published=$PUBLISHED"
          echo "version=$LOCAL" >> $GITHUB_OUTPUT
          if npm view "@l8c/ui@$LOCAL" version >/dev/null 2>&1; then
            echo "Version $LOCAL is already on npm, nothing to publish."
            echo "should-publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $LOCAL is new, will stage it."
            echo "should-publish=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared-components/package-lock.json

      - name: Install dependencies
        working-directory: shared-components
        run: npm ci

      - name: Build library
        working-directory: shared-components
        run: npm run build

      - name: Run unit tests
        working-directory: shared-components
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l8c-ui-dist
          path: shared-components/dist/l8c-ui
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage on npm, tag and release
    runs-on: ubuntu-latest
    needs: [check-version, build]
    environment: npm
    permissions:
      contents: write # create the release tag and GitHub release
      id-token: write # npm trusted publishing / provenance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: l8c-ui-dist
          path: dist/l8c-ui

      - name: Stage package on npm
        id: stage
        working-directory: dist/l8c-ui
        run: |
          set -o pipefail
          npm stage publish --access public --provenance 2>&1 | tee stage.log
          # Best effort: pick the stage id out of the CLI output for the summary
          STAGE_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' stage.log | head -n 1 || true)
          echo "stage-id=$STAGE_ID" >> $GITHUB_OUTPUT

      - name: Tag release
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # Release notes: the CHANGELOG section for this version, if present
          NOTES=$(awk -v v="## [$VERSION]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release @l8c/ui $VERSION."
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            --verify-tag

      - name: Write summary
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          STAGE_ID: ${{ steps.stage.outputs.stage-id }}
        run: |
          {
            echo "## Staged @l8c/ui $VERSION"
            echo ""
            echo "The version is waiting for approval on npm. It is **not** installable yet."
            echo ""
            echo "- Review and approve: https://www.npmjs.com/package/@l8c/ui (Staged versions), or"
            echo "  \`npm stage list @l8c/ui\` and \`npm stage approve <stage-id>\` (asks for 2FA)"
            if [ -n "$STAGE_ID" ]; then echo "- Stage id: \`$STAGE_ID\`"; fi
            echo "- Git tag and release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION"
            echo ""
            echo "Optional integrity check before approving: \`npm stage download <stage-id>\`, build the"
            echo "tagged commit locally with \`npm run publish:local\` and diff the two tarballs."
          } >> $GITHUB_STEP_SUMMARY
