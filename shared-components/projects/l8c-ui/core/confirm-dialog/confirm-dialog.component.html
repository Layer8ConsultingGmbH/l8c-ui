<l8c-dialog
  [title]="title()"
  [showCloseButton]="false"
  [contentLayout]="'flex'"
  (closed)="onDialogClosed()"
>
  <div class="confirm-dialog-content">
    <p class="confirm-message">{{ message() }}</p>

    <div class="dialog-actions">
      @if (mode() === 'info') {
        <l8c-button [action]="'primary'" (clicked)="close()">
          {{ closeLabel() }}
        </l8c-button>
      } @else {
        <l8c-button [action]="'nav'" (clicked)="close()">
          {{ cancelLabel() }}
        </l8c-button>
        <l8c-button [action]="'primary'" (clicked)="onConfirm()">
          {{ displayConfirmLabel() }}
        </l8c-button>
      }
    </div>
  </div>
</l8c-dialog>
