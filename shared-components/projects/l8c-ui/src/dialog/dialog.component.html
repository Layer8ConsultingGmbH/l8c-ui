<dialog #dialog class="lib-dialog">
  <div class="lib-dialog-header">
    <h2>{{ title() }}</h2>
    @if (showCloseButton()) {
      <button class="close-button" (click)="close()" type="button" aria-label="Close dialog">
        <l8c-icon [name]="'x'" [size]="18"></l8c-icon>
      </button>
    }
  </div>

  <div class="lib-dialog-content">
    <ng-content></ng-content>
  </div>
</dialog>
